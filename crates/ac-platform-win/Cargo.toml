[package]
name = "ac-platform-win"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ac-spike"
path = "src/main.rs"

[dependencies]
ac-core = { path = "../ac-core" }

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]
